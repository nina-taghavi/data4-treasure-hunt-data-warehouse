; Copy this file to config.ini and fill in your own values.
; config.ini is git-ignored, so your passwords stay on your machine.
[catchem]
driver_repo = org.postgresql:postgresql:42.7.7
driver = org.postgresql.Driver
url = jdbc:postgresql://postgres-data4:5432/catchem
database = catchem
host = postgres-data4
username = YOUR_USERNAME
password = YOUR_PASSWORD
port = 5432
schema = YOUR_SCHEMA

[catchem_dwh]
url = jdbc:postgresql://postgres-data4:5432/catchem_dwh
username = YOUR_USERNAME
password = YOUR_PASSWORD
host = postgres-data4
port = 5432
