; Copy this file to config.ini and fill in your own values.
; config.ini is git-ignored, so your passwords stay on your machine.
[default]
driver_repo = org.postgresql:postgresql:42.7.7
driver = org.postgresql.Driver
url = jdbc:postgresql://localhost:5432/tutorial_op
database = tutorial_op
host = localhost
username = YOUR_USERNAME
password = YOUR_PASSWORD
port = 5432
[tutorial_op]
driver_repo = org.postgresql:postgresql:42.7.7
driver = org.postgresql.Driver
url = jdbc:postgresql://localhost:5432/tutorial_op
database = tutorial_op
host = localhost
username = YOUR_USERNAME
password = YOUR_PASSWORD
port = 5432
[kafka]
kafka.bootstrap.servers = YOUR_KAFKA_BOOTSTRAP_SERVER:9092
topic =firstTest
kafka.sasl.username=YOUR_USERNAME
kafka.sasl.password = YOUR_PASSWORD
jaas.username = YOUR_USERNAME
jaas.password = YOUR_PASSWORD
